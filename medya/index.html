    <style>
        .reklam-table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 1300px; font-size: 12px; }
        .reklam-table th { background: #f8fafc; color: #64748b; padding: 14px 8px; text-align: center; border-bottom: 2px solid #e2e8f0; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
        .reklam-table td { padding: 10px 6px; border-bottom: 1px solid #f1f5f9; text-align: center; background: white; transition: background 0.2s; }
        .reklam-table tr:hover td { background: #f8fafc; }
        .reklam-input { width: 100%; min-width: 65px; padding: 8px; font-size: 12px; text-align: center; border: 1px solid #e2e8f0; border-radius: 6px; font-family: 'Poppins', sans-serif; background: #ffffff; color: #1e293b; font-weight: 500; transition: all 0.2s; }
        .reklam-input:focus { border-color: var(--task-purple); outline: none; box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.1); }
        .reklam-readonly { background: transparent; font-weight: 700; color: var(--primary-red); border-color: transparent; font-size: 13px;}
        
        /* YENİ: AYLIK ÖZET TABLOSU STİLLERİ */
        .summary-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 10px; }
        .summary-table th { color: white; padding: 8px 5px; text-align: center; border: 1px solid rgba(255,255,255,0.2); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .summary-table td { padding: 8px 5px; border: 1px solid #e2e8f0; text-align: center; color: var(--bg-dark); font-weight: 500; }
        .summary-table tr:nth-child(even) td { background: #f8fafc; }
        .summary-table tr:hover td { background: #f1f5f9; }
        .sb-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-weight: 700; font-size: 10px; margin: 0 2px; }
        .sb-tasarim { background: #fdf2f8; color: #db2777; border: 1px solid #fce7f3; }
        .sb-video { background: #fff7ed; color: #ea580c; border: 1px solid #ffedd5; }
    </style>
</head>
<body>

<div class="modal-overlay" id="task-modal"><div class="modal-content"><i class="fa-solid fa-xmark modal-close" onclick="closeModal('task-modal')"></i><h3 class="modal-title" id="task-modal-title">Paylaşım Görevi Ekle</h3><input type="hidden" id="task-doc-id" value=""><input type="hidden" id="task-category" value="rdgrup_paylasim"><div class="input-group"><label>Firma:</label><select id="t-firma"><option value="">Firmalar Yükleniyor...</option></select></div><div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;"><div class="input-group"><label>İçerik Türü:</label><select id="t-tur"><option value="Video">Video</option><option value="Tasarım">Tasarım</option><option value="Fotoğraf">Fotoğraf</option></select></div><div class="input-group"><label>Adet:</label><input type="number" id="t-adet" value="1" min="1" autocomplete="off"></div></div><div class="input-group"><label>Hazırlayacak Kişi:</label><select id="t-hazirlayan"></select></div><div class="input-group"><label>Paylaşacak Kişi:</label><select id="t-paylasan"></select></div><div class="input-group"><label>Tarih:</label><input type="text" id="t-tarih" placeholder="Tarih(ler) seçin..." autocomplete="off"></div><div class="input-group"><label>Not:</label><textarea id="t-not" rows="2" placeholder="Görev ile ilgili ek notlar..." autocomplete="off"></textarea></div><div class="checkbox-group" id="t-status-group" style="display: none;"><label><input type="checkbox" id="t-hazirlandi"> Hazırlandı</label><label><input type="checkbox" id="t-paylasildi"> Paylaşıldı</label></div><div style="display: flex; gap: 10px; margin-top: 15px;" id="task-buttons"><button type="button" class="login-btn btn-purple" id="save-task-btn" style="flex: 1;" onclick="saveTask()">Kaydet</button></div></div></div>
<div class="modal-overlay" id="shoot-modal"><div class="modal-content"><i class="fa-solid fa-xmark modal-close" onclick="closeModal('shoot-modal')"></i><h3 class="modal-title" id="shoot-modal-title">Çekim Ekle</h3><input type="hidden" id="sh-doc-id" value=""><div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;"><div class="input-group"><label>Firma Seç:</label><select id="sh-firma"><option value="">Firmalar Yükleniyor...</option></select></div><div class="input-group"><label>Tarih:</label><input type="text" id="sh-tarih" placeholder="Tarih seçin..." autocomplete="off"></div><div class="input-group" style="grid-column: span 2;"><label>Saat:</label><input type="time" id="sh-saat" style="font-family: 'Poppins';" autocomplete="off"></div></div><div class="input-group"><label>Çekimi Yapanlar:</label><div class="multi-checkbox-list" id="sh-kisi-list"></div></div><div class="input-group"><label>Kullanılacak Ekipmanlar:</label><div class="multi-checkbox-list" id="sh-eq-list"></div></div><div class="input-group"><label>Çekim Notu:</label><textarea id="sh-not" rows="2" placeholder="Mekan, konsept vb. detaylar..." autocomplete="off"></textarea></div><div id="shoot-extra-fields" style="display: none;"><h4 style="font-size: 13px; color: var(--bg-dark); margin: 15px 0 10px; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px;">Yedek ve Teslimat Süreci</h4><div class="checkbox-group"><label><input type="checkbox" id="sh-cekildi"> Çekim yapıldı</label><label><input type="checkbox" id="sh-teslim"> Yedek Teslim Edildi</label><label><input type="checkbox" id="sh-hdd"> Yedek HDD'ye Alındı</label><label><input type="checkbox" id="sh-drive"> Yedek Drive'a Alındı</label></div><div class="input-group" style="margin-top: 10px;"><label>Yedek Linki:</label><div style="display: flex; gap: 10px;"><input type="text" id="sh-link" placeholder="Drive, WeTransfer vb. link" style="flex: 1;" autocomplete="off"><button type="button" class="login-btn btn-light" style="width: auto; padding: 10px 15px;" onclick="goToShootLink()" title="Linke Git"><i class="fa-solid fa-arrow-up-right-from-square"></i></button></div></div><div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;"><div class="input-group"><label>Toplam Boyut:</label><input type="text" id="sh-boyut" placeholder="Örn: 45 GB" autocomplete="off"></div><div class="input-group"><label>Foto Sayısı:</label><input type="number" id="sh-foto" value="0" min="0" autocomplete="off"></div><div class="input-group"><label>Video Sayısı:</label><input type="number" id="sh-video" value="0" min="0" autocomplete="off"></div></div></div><div style="display: flex; gap: 10px; margin-top: 15px;" id="shoot-buttons"><button type="button" class="login-btn btn-orange" id="save-shoot-btn" style="flex: 1;" onclick="saveShoot()">Kaydet</button></div></div></div>
<div class="modal-overlay" id="ga-modal"><div class="modal-content"><i class="fa-solid fa-xmark modal-close" onclick="closeModal('ga-modal')"></i><h3 class="modal-title" id="ga-modal-title">Genel Ajanda - Görev Ekle</h3><input type="hidden" id="ga-doc-id" value="new"><input type="hidden" id="ga-status" value="0"><div class="input-group"><label>GÖREV BAŞLIĞI</label><input type="text" id="ga-title" placeholder="Ateşbey Gayrimenkul, Festival vs." autocomplete="off"></div><div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;"><div class="input-group"><label>FİRMA SEÇ</label><select id="ga-firma"></select></div><div class="input-group"><label>TESLİM TARİHİ</label><input type="text" id="ga-tarih" placeholder="Tarih seçin..." autocomplete="off"></div><div class="input-group"><label>SORUMLU KİŞİ</label><select id="ga-sorumlu"></select></div><div class="input-group"><label>EKLEYEN</label><input type="text" id="ga-ekleyen" disabled></div><div class="input-group"><label>VİDEO SAYISI</label><input type="number" id="ga-video" value="0" min="0" autocomplete="off"></div><div class="input-group"><label>TASARIM SAYISI</label><input type="number" id="ga-tasarim" value="0" min="0" autocomplete="off"></div></div><div class="input-group"><label>NOT İÇERİĞİ</label><div class="rt-toolbar"><button type="button" class="rt-btn" onclick="execCmd('bold')" title="Kalın"><b>B</b></button><button type="button" class="rt-btn" onclick="execCmd('italic')" title="İtalik"><i>I</i></button><button type="button" class="rt-btn" onclick="execCmd('insertUnorderedList')" title="Madde İşareti"><i class="fa-solid fa-list-ul"></i></button><button type="button" class="rt-btn" onclick="insertCheckbox()" title="Checkbox Ekle"><i class="fa-regular fa-square-check"></i></button></div><div id="ga-not" class="rt-editor" contenteditable="true" placeholder="Notları buraya yazınız..."></div></div><div style="display: flex; gap: 10px; margin-top: 15px;" id="ga-buttons"><button type="button" class="login-btn btn-purple" id="save-ga-btn" style="flex: 1;" onclick="saveGenelAgenda()">Ekle</button></div></div></div>
<div class="modal-overlay" id="company-note-modal"><div class="modal-content" style="width: 500px;"><i class="fa-solid fa-xmark modal-close" onclick="closeModal('company-note-modal')"></i><h3 class="modal-title" id="comp-note-title">Firma Notu</h3><input type="hidden" id="comp-note-doc-id" value=""><textarea id="comp-note-text" class="chk-textarea" placeholder="Bu firma ile ilgili önemli notlar, briefler veya stratejiler..." style="min-height: 150px;" autocomplete="off"></textarea><div style="display: flex; gap: 10px; margin-top: 15px;"><button type="button" class="login-btn btn-gray" style="flex: 1;" onclick="closeModal('company-note-modal')">Kapat</button><button type="button" class="login-btn btn-purple" id="save-comp-note-btn" style="flex: 1;" onclick="saveCompanyNote()">Notu Kaydet</button></div></div></div>
<div class="modal-overlay" id="eq-plan-modal"><div class="modal-content" style="width: 500px;"><i class="fa-solid fa-xmark modal-close" onclick="closeModal('eq-plan-modal')"></i><h3 class="modal-title" id="eq-plan-title">Haftalık Plan</h3><div id="eq-plan-content" style="max-height: 350px; overflow-y: auto; margin-top:15px;"></div><div style="margin-top: 15px;"><button type="button" class="login-btn btn-gray" style="width:100%;" onclick="closeModal('eq-plan-modal')">Kapat</button></div></div></div>

<div class="modal-overlay" id="share-counts-modal">
    <div class="modal-content" style="width: 750px; max-width: 95vw;">
        <i class="fa-solid fa-xmark modal-close" onclick="closeModal('share-counts-modal')"></i>
        <h3 class="modal-title" style="border:none; padding:0; margin-bottom: 5px;"><i class="fa-solid fa-chart-pie" style="color: var(--task-purple); margin-right:6px;"></i> Aylık Paylaşım Özetleri</h3>
        <div id="sc-modal-content"></div>
        <div style="margin-top: 15px;"><button type="button" class="login-btn btn-gray" style="width:100%;" onclick="closeModal('share-counts-modal')">Kapat</button></div>
    </div>
</div>

<div class="slide-container" id="dashboard-screen" style="display: flex;"> <div class="dashboard-layout">
        <div class="sidebar" id="app-sidebar">
            <div id="sidebar-top-bar" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <div class="sidebar-profile" onclick="loadProfileView()">
                    <div class="avatar" id="logged-avatar">A</div>
                    <div class="profile-texts"><div style="font-weight: 700; color: var(--bg-dark); font-size: 14px;" id="logged-user-name">Kullanıcı</div><div style="font-size: 11px; color: var(--text-muted);" id="logged-user-role">Rol</div></div>
                </div>
                <button type="button" class="action-btn" id="sidebar-toggle-btn" onclick="toggleSidebar()" style="padding: 8px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0; margin-left: 5px;"><i class="fa-solid fa-bars"></i></button>
            </div>
            <button type="button" class="back-to-company" onclick="backToCompanySelection()"><i class="fa-solid fa-arrow-left"></i> <span>Şube Seçimine Dön</span></button>
            <div class="menu-category" style="font-size: 10px; font-weight: 700; color:#94a3b8; margin-bottom: 8px; letter-spacing: 1px;">MENÜ</div>
            <ul class="menu-list" id="sidebar-menu"></ul>
            <button type="button" class="logout-item" onclick="logout()"><i class="fa-solid fa-power-off"></i> <span>Çıkış Yap</span></button>
        </div>
        <div class="main-panel" id="main-content">
            <div class="full-loader" id="init-loader" style="display: flex; background: transparent;"><div class="spinner"></div><p style="margin-top: 15px; font-weight: 600; font-size:12px; color: var(--text-muted);">Sistem Yükleniyor...</p></div>
        </div>
    </div>
</div>

<script src="../js/firebase-config.js"></script>
<script>
    let dbUsers = []; let dbTasks = []; let dbShoots = []; let dbAgenda = []; let dbCompanies = []; let dbGenelAgenda = []; let dbPersonalAgenda = []; let dbAds = []; let dbEquipments = []; let dbSpecialDays = [];
    let currentUser = null; let currentCompany = "RDGRUP MEDYA"; 
    let activePage = ""; let showArchivedGA = false; let reportDate = new Date(); let reklamDate = new Date();
    let taskDatePicker, shootDatePicker, chkDatePicker, gaDatePicker;
    let calDate = new Date(); let currentCalView = 'month'; let currentChecklistDate = formatDate(new Date()); let isSidebarCollapsed = false;

    const normalizeStr = (str) => (str || "").replace(/\s+/g, '').toLowerCase();
    function formatDate(dateObj) { let d = new Date(dateObj), month = '' + (d.getMonth() + 1), day = '' + d.getDate(), year = d.getFullYear(); if (month.length < 2) month = '0' + month; if (day.length < 2) day = '0' + day; return [year, month, day].join('-'); }
    function formatDateTR(dateString) { if(!dateString) return ""; return new Date(dateString).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric', weekday: 'short' }); }
    function calculateDaysPassed(dateString) { if (!dateString) return null; const targetDate = new Date(dateString); const today = new Date(); targetDate.setHours(0,0,0,0); today.setHours(0,0,0,0); const diffTime = today - targetDate; const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)); return diffDays >= 0 ? diffDays : 0; }

    window.onload = async function() {
        const savedUser = localStorage.getItem('rdgrup_user'); if (!savedUser) { window.location.href = '../index.html'; return; }
        currentUser = JSON.parse(savedUser); document.getElementById('logged-user-name').innerText = currentUser.name || "Kullanıcı"; document.getElementById('logged-user-role').innerText = currentUser.role || "Bilinmiyor"; document.getElementById('logged-avatar').innerText = (currentUser.name || "?").charAt(0).toUpperCase();
        await initializeSystem();
    };

    async function initializeSystem() {
        try {
            await fetchCompaniesFromFirebase(); await fetchUsersFromFirebase(); await fetchEquipmentsFromFirebase(); await fetchTasksFromFirebase(); await fetchShootsFromFirebase(); await fetchAgendaFromFirebase(); await fetchGenelAgendaFromFirebase(); await fetchAdsFromFirebase(); await fetchSpecialDaysFromFirebase();
            loadSidebarMenu();
        } catch (error) { console.error("Bağlantı hatası: ", error); } finally { document.getElementById('init-loader').style.display = 'none'; }
    }

    function logout() { localStorage.removeItem('rdgrup_user'); window.location.href = '../index.html'; }
    function backToCompanySelection() { window.location.href = '../index.html'; }
    function toggleSidebar() { isSidebarCollapsed = !isSidebarCollapsed; const sb = document.getElementById('app-sidebar'); if (isSidebarCollapsed) { sb.classList.add('collapsed'); } else { sb.classList.remove('collapsed'); } }
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    async function fetchUsersFromFirebase() { const snapshot = await db.collection('users').get(); dbUsers = []; snapshot.forEach(doc => { dbUsers.push({ docId: doc.id, ...doc.data() }); }); dbUsers.sort((a, b) => (a.order || 0) - (b.order || 0)); populateUserDropdowns(); }
    async function fetchCompaniesFromFirebase() { const snapshot = await db.collection('companies').get(); dbCompanies = []; snapshot.forEach(doc => { dbCompanies.push({ docId: doc.id, ...doc.data() }); }); dbCompanies.sort((a, b) => (a.order || 0) - (b.order || 0)); populateCompanyDropdown(); }
    async function fetchEquipmentsFromFirebase() { const snapshot = await db.collection('equipments').get(); dbEquipments = []; snapshot.forEach(doc => { dbEquipments.push({ docId: doc.id, ...doc.data() }); }); dbEquipments.sort((a, b) => (a.order || 0) - (b.order || 0)); }
    async function fetchTasksFromFirebase() { const snapshot = await db.collection('tasks').get(); dbTasks = []; snapshot.forEach(doc => { dbTasks.push({ docId: doc.id, ...doc.data() }); }); }
    async function fetchShootsFromFirebase() { const snapshot = await db.collection('shoots').get(); dbShoots = []; snapshot.forEach(doc => { dbShoots.push({ docId: doc.id, ...doc.data() }); }); }
    async function fetchAgendaFromFirebase() { const snapshot = await db.collection('agenda').get(); dbAgenda = []; snapshot.forEach(doc => { dbAgenda.push({ docId: doc.id, ...doc.data() }); }); }
    async function fetchGenelAgendaFromFirebase() { const snapshot = await db.collection('genel_agenda').get(); dbGenelAgenda = []; snapshot.forEach(doc => { dbGenelAgenda.push({ docId: doc.id, ...doc.data() }); }); }
    async function fetchPersonalAgendaFromFirebase() { if(!currentUser) return; const snapshot = await db.collection('personal_agenda').where('userId', '==', currentUser.id).get(); dbPersonalAgenda = []; snapshot.forEach(doc => { dbPersonalAgenda.push({ docId: doc.id, ...doc.data() }); }); }
    async function fetchAdsFromFirebase() { const snapshot = await db.collection('ads_data').get(); dbAds = []; snapshot.forEach(doc => { dbAds.push({ docId: doc.id, ...doc.data() }); }); }
    async function fetchSpecialDaysFromFirebase() { const snapshot = await db.collection('special_days').get(); dbSpecialDays = []; snapshot.forEach(doc => { dbSpecialDays.push({ docId: doc.id, ...doc.data() }); }); }

    function populateUserDropdowns() {
        const hSelect = document.getElementById('t-hazirlayan'), pSelect = document.getElementById('t-paylasan'); const sSelect = document.getElementById('sh-kisi-list'), gaSelect = document.getElementById('ga-sorumlu');
        if(hSelect) hSelect.innerHTML = ''; if(pSelect) pSelect.innerHTML = ''; if(sSelect) sSelect.innerHTML = ''; if(gaSelect) gaSelect.innerHTML = '';
        dbUsers.forEach(u => {
            const safeName = u.name || "İsimsiz"; const safeSurname = u.surname || ""; let n = `${safeName} ${safeSurname}`.trim();
            if(hSelect) hSelect.add(new Option(n, safeName)); if(pSelect) pSelect.add(new Option(n, safeName)); if(gaSelect) gaSelect.add(new Option(n, safeName));
            if(sSelect) sSelect.innerHTML += `<label><input type="checkbox" value="${safeName}" class="sh-kisi-cb"> <span>${n}</span></label>`;
        });
    }

    function populateCompanyDropdown() {
        const fSelect = document.getElementById('t-firma'), shSelect = document.getElementById('sh-firma'), gaSelect = document.getElementById('ga-firma');
        if(fSelect) fSelect.innerHTML = ''; if(shSelect) shSelect.innerHTML = ''; if(gaSelect) gaSelect.innerHTML = '';
        if(dbCompanies.length === 0) { let opt = new Option("Firma bulunamadı", ""); if(fSelect) fSelect.add(opt); if(shSelect) shSelect.add(opt); if(gaSelect) gaSelect.add(opt); } 
        else { dbCompanies.forEach(c => { const cName = c.name || "İsimsiz"; if(fSelect) fSelect.add(new Option(cName, cName)); if(shSelect) shSelect.add(new Option(cName, cName)); if(gaSelect) gaSelect.add(new Option(cName, cName)); }); }
    }

    function loadSidebarMenu() {
        const sidebarMenu = document.getElementById('sidebar-menu'); sidebarMenu.innerHTML = ''; 
        const items = [{ icon: 'fa-house', name: 'Anasayfa' }, { icon: 'fa-clipboard-user', name: 'Kendi İşlerim' }, { icon: 'fa-calendar-days', name: 'Genel Takvim' }, { icon: 'fa-users', name: 'Paylaşım Takvimi' }, { icon: 'fa-camera', name: 'Çekim Takvimi' }, { icon: 'fa-building', name: 'Firmalar' }, { icon: 'fa-list-check', name: 'Checklist' }, { icon: 'fa-book', name: 'Genel Ajanda' }, { icon: 'fa-book-open', name: 'Kişisel Ajanda' }, { icon: 'fa-bullhorn', name: 'Reklamlar' }, { icon: 'fa-toolbox', name: 'Ekipmanlar' }, { icon: 'fa-chart-bar', name: 'Raporlar' }];
        const role = (currentUser.role || "").toLowerCase(); const isAdminOrYonetici = role === 'admin' || role === 'yönetici' || currentUser.id === 'alperen';
        items.forEach((item) => {
            if ((item.name === 'Raporlar' || item.name === 'Reklamlar') && !isAdminOrYonetici) return; 
            const li = document.createElement('li'); li.className = 'menu-item';
            if (sidebarMenu.children.length === 0) li.classList.add('active'); 
            li.innerHTML = `<i class="fa-solid ${item.icon}"></i> <span>${item.name}</span>`;
            li.onclick = () => { document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active')); li.classList.add('active'); loadPageView(item.name); };
            sidebarMenu.appendChild(li);
        });
        loadPageView(items[0].name);
    }

    function loadPageView(pageName) {
        activePage = pageName; const mainContent = document.getElementById('main-content');
        if (pageName === 'Raporlar') { reportDate = new Date(); loadRaporlarPage(); } else if (pageName === 'Reklamlar') { reklamDate = new Date(); loadReklamlarPage(); } else if (pageName === 'Ekipmanlar') { loadEkipmanlarPage(); } else if (pageName === 'Firmalar') loadFirmalarPage(); else if (pageName === 'Checklist') loadChecklistPage(currentChecklistDate); else if (pageName === 'Genel Ajanda') loadGenelAgenda(); else if (pageName === 'Kişisel Ajanda') loadPersonalAgenda(); else if (pageName === 'Anasayfa' || pageName === 'Kendi İşlerim') mainContent.innerHTML = renderDashboardHome(pageName); else if (pageName.includes('Takvim')) { mainContent.innerHTML = renderCalendarView(pageName); initCalendar(); }
    }

    // --- YENİ EKLENEN ÖZEL GÜNLER BÖLÜMÜ ---
    function initCalendar() {
        const grid = document.getElementById('calendar-wrapper'); const monthYearText = document.getElementById('calendar-month-year'); grid.innerHTML = '';
        let y = calDate.getFullYear(); let m = calDate.getMonth();
        if(currentCalView === 'day') monthYearText.innerText = calDate.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' }); else monthYearText.innerText = calDate.toLocaleDateString('tr-TR', { month: 'long', year: 'numeric' });
        let validTasks = dbTasks.filter(t => normalizeStr(t.holding || t.firma) === normalizeStr(currentCompany)); let validShoots = dbShoots.filter(s => normalizeStr(s.holding || s.firma) === normalizeStr(currentCompany)); let visibleItems = [];
        if (activePage === 'Paylaşım Takvimi') visibleItems = validTasks.map(t => ({...t, itemType: 'task'})); else if (activePage === 'Çekim Takvimi') visibleItems = validShoots.map(s => ({...s, itemType: 'shoot'})); else visibleItems = [...validTasks.map(t => ({...t, itemType: 'task'})), ...validShoots.map(s => ({...s, itemType: 'shoot'}))];

        function getTasksForDateHTML(dateString) {

        `;

        if(targetUsers.length === 0) html += `<div style="text-align:center; padding: 30px; color: var(--text-muted);">Bu şirketin checklistinde görünecek kullanıcı bulunamadı.</div>`;
        targetUsers.forEach(u => { let noteContent = checklistData[u.id] || ""; let canEdit = isAdmin || (!isPast && u.id === currentUser.id); let disabledAttr = canEdit ? "" : "disabled"; html += `<div class="chk-user-card"><span class="chk-user-title">${u.name || "İsimsiz"}</span><textarea class="chk-textarea" id="chk-txt-${u.id}" placeholder="Buraya notlarınızı yazın... Kaydettiğinizde otomatik olarak numaralandırılacaktır." ${disabledAttr} autocomplete="off">${noteContent}</textarea>${canEdit ? `<div style="text-align: right;"><button type="button" class="login-btn btn-green" style="width: auto; padding: 6px 15px;" onclick="saveChecklist('${u.id}')">Listeyi Kaydet / Sırala</button></div>` : ''}</div>`; }); html += `</div></div>`; document.getElementById('main-content').innerHTML = html;
        if(chkDatePicker) chkDatePicker.destroy(); chkDatePicker = flatpickr("#chk-date-picker", { dateFormat: "Y-m-d", locale: "tr", defaultDate: currentChecklistDate, altInput: true, altFormat: "j F Y", onChange: function(selectedDates, dateStr) { loadChecklistPage(dateStr); } });
    }
    function changeChecklistDate(direction) { let d = new Date(currentChecklistDate); d.setDate(d.getDate() + direction); loadChecklistPage(formatDate(d)); }
    async function saveChecklist(userId) { let btn = event.target; btn.innerText = "Kaydediliyor..."; try { let txtArea = document.getElementById(`chk-txt-${userId}`); let rawText = txtArea.value; let lines = rawText.split('\n'); let counter = 1; let formattedText = lines.map(line => { let cleanLine = line.replace(/^\d+[\-\.)]\s*/, '').trim(); if(cleanLine === "") return ""; return `${counter++}- ${cleanLine}`; }).filter(l => l !== "").join('\n'); txtArea.value = formattedText; let docId = `chk_${currentCompany}_${currentChecklistDate}`; let docRef = db.collection('checklists').doc(docId); await docRef.set({ notes: { [userId]: formattedText }, company: currentCompany, date: currentChecklistDate }, { merge: true }); let oldText = "Listeyi Kaydet / Sırala"; btn.innerText = "Kaydedildi!"; btn.style.backgroundColor = "#16a34a"; setTimeout(() => { btn.innerText = oldText; btn.style.backgroundColor = ""; }, 2000); } catch (error) { console.error("Checklist Kayıt Hatası: ", error); alert("Kaydedilemedi, bağlantınızı kontrol edin."); btn.innerText = "Listeyi Kaydet / Sırala"; } }
    function downloadChecklistImage() { const element = document.getElementById('checklist-export-area'); const textareas = element.querySelectorAll('textarea'); textareas.forEach(ta => { ta.style.height = ta.scrollHeight + "px"; ta.style.overflow = "hidden"; }); html2canvas(element, { scale: 2, backgroundColor: "#f8fafc" }).then(canvas => { const link = document.createElement('a'); link.download = `${currentCompany}_Checklist_${currentChecklistDate}.png`; link.href = canvas.toDataURL('image/png'); link.click(); textareas.forEach(ta => { ta.style.height = ""; ta.style.overflow = "auto"; }); }); }

    async function loadRaporlarPage() {
        document.getElementById('main-content').innerHTML = `<div class="full-loader" style="position:relative; height: 300px; background: transparent;"><div class="spinner"></div><p style="margin-top: 15px; font-weight: 600; font-size:12px; color: var(--text-muted);">Raporlar Hesaplanıyor...</p></div>`;
        let y = reportDate.getFullYear(); let m = reportDate.getMonth() + 1; let monthStr = `${y}-${m < 10 ? '0'+m : m}`; let displayMonth = reportDate.toLocaleDateString('tr-TR', { month: 'long', year: 'numeric' });
        const chkSnapshot = await db.collection('checklists').where('company', '==', currentCompany).get(); let monthlyChecklists = []; chkSnapshot.forEach(doc => { let d = doc.data(); if(d.date && d.date.startsWith(monthStr)) { monthlyChecklists.push(d); } });
        let rTasks = dbTasks.filter(t => normalizeStr(t.holding || t.firma) === normalizeStr(currentCompany) && (t.tarih || "").startsWith(monthStr)); let rShoots = dbShoots.filter(s => normalizeStr(s.holding || s.firma) === normalizeStr(currentCompany) && (s.tarih || "").startsWith(monthStr));

        let html = `<div class="content-card" style="padding: 20px;"><div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;"><h2 class="content-title" style="margin-bottom: 0; border: none; padding:0;">${currentCompany} - Aylık Performans Raporları</h2></div><div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: #f8fafc; padding: 10px 15px; border-radius: 10px; border: 1px solid #e2e8f0;"><div style="display: flex; gap: 8px; align-items: center;"><button type="button" class="action-btn" onclick="changeReportMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button><button type="button" class="action-btn" onclick="changeReportMonth(1)"><i class="fa-solid fa-chevron-right"></i></button><button type="button" class="login-btn btn-light" style="width: auto; padding: 5px 12px; font-size: 11px; margin:0;" onclick="reportDate = new Date(); loadRaporlarPage();">Bu Ay</button></div><h3 style="font-size: 16px; color: var(--bg-dark); font-weight: 700; margin: 0; text-transform:uppercase;">${displayMonth}</h3><div style="width: 100px;"></div></div><div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px;">`;
        dbUsers.forEach(u => {
            let repComps = u.repCompanies || []; if (!repComps.includes(currentCompany) && u.id !== 'alperen') return; const safeName = u.name || "";
            let chkDays = 0; let chkItems = 0; monthlyChecklists.forEach(chk => { if(chk.notes && chk.notes[u.id]) { let text = chk.notes[u.id].trim(); if(text !== "") { chkDays++; chkItems += text.split('\n').filter(l => l.trim() !== "").length; } } }); let bosGunSayisi = monthlyChecklists.length - chkDays;
            let videoCount = 0; let tasarimCount = 0; let paylasimCount = 0; rTasks.forEach(t => { if(t.hazirlandi && t.paylasildi) { if(t.hazirlayan === safeName) { if(t.tur === 'Video') videoCount++; if(t.tur === 'Tasarım') tasarimCount++; } if(t.paylasan === safeName) { paylasimCount++; } } });
            let gaVideo = 0; let gaTasarim = 0; dbGenelAgenda.forEach(g => { if (normalizeStr(g.holding || g.firma) === normalizeStr(currentCompany) && g.status === 3 && (g.tarih || "").startsWith(monthStr)) { if (g.sorumlu === safeName) { gaVideo += (parseInt(g.video) || 0); gaTasarim += (parseInt(g.tasarim) || 0); } } }); videoCount += gaVideo; tasarimCount += gaTasarim;
            let cekimCount = 0; rShoots.forEach(s => { if(s.cekildi && s.teslim && s.hdd && s.drive) { let k = Array.isArray(s.kisi) ? s.kisi : [s.kisi]; if(k.includes(safeName)) { cekimCount++; } } });

            html += `<div style="background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); transition: 0.2s;"><div style="display: flex; align-items: center; gap: 12px; margin-bottom: 15px; border-bottom: 1px dashed #cbd5e1; padding-bottom: 12px;"><div style="width: 40px; height: 40px; background: linear-gradient(135deg, var(--task-purple), #4338ca); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; box-shadow: 0 4px 8px rgba(108, 99, 255, 0.2);">${safeName.charAt(0).toUpperCase()}</div><div><h4 style="font-size: 15px; color: var(--bg-dark); margin:0; font-weight: 700;">${safeName} ${u.surname || ""}</h4><span style="font-size: 11px; color: var(--text-muted); font-weight: 500;">${u.role || "Bilinmiyor"}</span></div></div><ul style="list-style: none; padding: 0; margin: 0; font-size: 13px; color: var(--text-main); display: flex; flex-direction: column; gap: 10px;"><li style="display: flex; justify-content: space-between; align-items: center; background:#f8fafc; padding: 6px 10px; border-radius: 6px;"><span style="display:flex; align-items:center; gap:8px;"><i class="fa-solid fa-list-check" style="color:#64748b; font-size:14px;"></i> Checklist</span> <b style="color:var(--bg-dark);">${chkItems} Madde (${bosGunSayisi} boş gün)</b></li><li style="display: flex; justify-content: space-between; align-items: center; background:#fff7ed; padding: 6px 10px; border-radius: 6px;"><span style="display:flex; align-items:center; gap:8px;" title="Ajandadan Gelen: ${gaVideo}"><i class="fa-solid fa-video" style="color:var(--shoot-orange); font-size:14px;"></i> Yapılan Video</span> <b style="color:var(--shoot-orange);">${videoCount}</b></li><li style="display: flex; justify-content: space-between; align-items: center; background:#fdf2f8; padding: 6px 10px; border-radius: 6px;"><span style="display:flex; align-items:center; gap:8px;" title="Ajandadan Gelen: ${gaTasarim}"><i class="fa-solid fa-pen-nib" style="color:#ec4899; font-size:14px;"></i> Yapılan Tasarım</span> <b style="color:#ec4899;">${tasarimCount}</b></li><li style="display: flex; justify-content: space-between; align-items: center; background:#fef2f2; padding: 6px 10px; border-radius: 6px;"><span style="display:flex; align-items:center; gap:8px;"><i class="fa-solid fa-share-nodes" style="color:var(--primary-red); font-size:14px;"></i> Yapılan Paylaşım</span> <b style="color:var(--primary-red);">${paylasimCount}</b></li><li style="display: flex; justify-content: space-between; align-items: center; background:#ecfdf5; padding: 6px 10px; border-radius: 6px;"><span style="display:flex; align-items:center; gap:8px;"><i class="fa-solid fa-camera" style="color:#10b981; font-size:14px;"></i> Tamamlanan Çekim</span> <b style="color:#10b981;">${cekimCount}</b></li></ul></div>`;
        });
        html += `</div></div>`; document.getElementById('main-content').innerHTML = html;
    }
    function changeReportMonth(direction) { reportDate.setMonth(reportDate.getMonth() + direction); loadRaporlarPage(); }

    function openAddTask() { document.getElementById('task-modal-title').innerText = "Paylaşım Görevi Ekle"; document.getElementById('task-doc-id').value = "new"; document.getElementById('t-firma').value = ""; document.getElementById('t-adet').value = "1"; document.getElementById('t-not').value = ""; if(taskDatePicker) taskDatePicker.destroy(); taskDatePicker = flatpickr("#t-tarih", { mode: "multiple", dateFormat: "Y-m-d", locale: "tr", defaultDate: new Date(), altInput: true, altFormat: "j F Y" }); document.getElementById('t-status-group').style.display = 'none'; document.getElementById('t-hazirlandi').checked = false; document.getElementById('t-paylasildi').checked = false; document.getElementById('task-buttons').innerHTML = `<button type="button" class="login-btn btn-gray" style="flex: 1;" onclick="closeModal('task-modal')">Kapat</button><button type="button" class="login-btn btn-purple" id="save-task-btn" style="flex: 1;" onclick="saveTask()">Kaydet</button>`; openModal('task-modal'); }
    function openEditTask(docId) { const t = dbTasks.find(x => x.docId === docId); if(!t) return; document.getElementById('task-modal-title').innerText = "Paylaşım Görevi Düzenle"; document.getElementById('task-doc-id').value = docId; document.getElementById('t-firma').value = t.firma || ""; document.getElementById('t-tur').value = t.tur || ""; document.getElementById('t-adet').value = t.adet || 1; document.getElementById('t-hazirlayan').value = t.hazirlayan || ""; document.getElementById('t-paylasan').value = t.paylasan || ""; document.getElementById('t-not').value = t.not || ""; if(taskDatePicker) taskDatePicker.destroy(); taskDatePicker = flatpickr("#t-tarih", { mode: "single", dateFormat: "Y-m-d", locale: "tr", defaultDate: t.tarih, altInput: true, altFormat: "j F Y" }); document.getElementById('t-status-group').style.display = 'flex'; document.getElementById('t-hazirlandi').checked = t.hazirlandi; document.getElementById('t-paylasildi').checked = t.paylasildi; document.getElementById('task-buttons').innerHTML = `<button type="button" class="login-btn btn-purple" id="save-task-btn" style="flex: 1;" onclick="saveTask()">Kaydet</button><button type="button" class="login-btn" style="flex: 1; background: var(--primary-red);" onclick="deleteTask('${docId}')">Sil</button><button type="button" class="login-btn btn-gray" style="flex: 1;" onclick="closeModal('task-modal')">Kapat</button>`; openModal('task-modal'); }
    async function saveTask() { const docId = document.getElementById('task-doc-id').value; const btn = document.getElementById('save-task-btn'); btn.innerText = "Kaydediliyor..."; try { const taskData = { holding: currentCompany, category: document.getElementById('task-category').value, firma: document.getElementById('t-firma').value || "", tur: document.getElementById('t-tur').value, adet: parseInt(document.getElementById('t-adet').value) || 1, hazirlayan: document.getElementById('t-hazirlayan').value, paylasan: document.getElementById('t-paylasan').value, not: document.getElementById('t-not').value, hazirlandi: document.getElementById('t-hazirlandi').checked, paylasildi: document.getElementById('t-paylasildi').checked }; let dates = taskDatePicker.selectedDates.map(d => formatDate(d)); if(dates.length === 0) dates = [formatDate(new Date())]; if(docId === "new") { taskData.hazirlandi = false; taskData.paylasildi = false; for (let d of dates) { if(d) await db.collection('tasks').add({ ...taskData, tarih: d }); } } else { taskData.tarih = dates[0]; await db.collection('tasks').doc(docId).update(taskData); } closeModal('task-modal'); await fetchTasksFromFirebase(); loadPageView(activePage); } catch (error) { console.error("Görev Kayıt Hatası:", error); alert("Görev kaydedilemedi. Bağlantınızı kontrol edin."); btn.innerText = "Kaydet"; } }
    async function toggleTaskStatus(docId, type) { const t = dbTasks.find(x => x.docId === docId); if(!t) return; let updateData = {}; updateData[type] = !t[type]; t[type] = !t[type]; initCalendar(); await db.collection('tasks').doc(docId).update(updateData); await fetchTasksFromFirebase(); }
    async function deleteTask(docId) { if(confirm("Görevi silmek istediğinize emin misiniz?")) { await db.collection('tasks').doc(docId).delete(); closeModal('task-modal'); await fetchTasksFromFirebase(); loadPageView(activePage); } }

    function openAddShoot() { 
        document.getElementById('shoot-modal-title').innerText = "Çekim Ekle"; document.getElementById('sh-doc-id').value = "new"; document.getElementById('sh-firma').value = ""; document.getElementById('sh-not').value = ""; document.getElementById('sh-link').value = ""; document.getElementById('sh-boyut').value = ""; document.getElementById('sh-foto').value = "0"; document.getElementById('sh-video').value = "0"; document.getElementById('sh-cekildi').checked = false; document.getElementById('sh-teslim').checked = false; document.getElementById('sh-hdd').checked = false; document.getElementById('sh-drive').checked = false; 
        document.querySelectorAll('.sh-kisi-cb').forEach(cb => cb.checked = false); 
        
        let eqHtml = ''; dbEquipments.filter(e => e.company === currentCompany).forEach(e => { eqHtml += `<label><input type="checkbox" value="${e.docId}" class="sh-eq-cb"> <span>${e.name}</span></label>`; }); document.getElementById('sh-eq-list').innerHTML = eqHtml;
        
        if(shootDatePicker) shootDatePicker.destroy(); shootDatePicker = flatpickr("#sh-tarih", { dateFormat: "Y-m-d", locale: "tr", defaultDate: new Date(), altInput: true, altFormat: "j F Y" }); document.getElementById('sh-saat').value = ""; document.getElementById('shoot-extra-fields').style.display = 'none'; document.getElementById('shoot-buttons').innerHTML = `<button type="button" class="login-btn btn-gray" style="flex: 1;" onclick="closeModal('shoot-modal')">Kapat</button><button type="button" class="login-btn btn-orange" id="save-shoot-btn" style="flex: 1;" onclick="saveShoot()">Kaydet</button>`; openModal('shoot-modal'); 
    }
    
    function openEditShoot(docId) { 
        const s = dbShoots.find(x => x.docId === docId); if(!s) return; 
        document.getElementById('shoot-modal-title').innerText = "Çekim Kartı (Düzenle)"; document.getElementById('sh-doc-id').value = docId; document.getElementById('sh-firma').value = s.firma || ""; document.getElementById('sh-not').value = s.not || ""; document.getElementById('sh-link').value = s.link || ""; document.getElementById('sh-boyut').value = s.boyut || ""; document.getElementById('sh-foto').value = s.foto || 0; document.getElementById('sh-video').value = s.video || 0; document.getElementById('sh-cekildi').checked = s.cekildi; document.getElementById('sh-teslim').checked = s.teslim; document.getElementById('sh-hdd').checked = s.hdd; document.getElementById('sh-drive').checked = s.drive; 
        
        let kisiArray = Array.isArray(s.kisi) ? s.kisi : [s.kisi]; document.querySelectorAll('.sh-kisi-cb').forEach(cb => { cb.checked = kisiArray.includes(cb.value); }); 
        
        let eqArray = Array.isArray(s.equipments) ? s.equipments : []; let eqHtml = ''; dbEquipments.filter(e => e.company === currentCompany).forEach(e => { let isChecked = eqArray.includes(e.docId) ? 'checked' : ''; eqHtml += `<label><input type="checkbox" value="${e.docId}" class="sh-eq-cb" ${isChecked}> <span>${e.name}</span></label>`; }); document.getElementById('sh-eq-list').innerHTML = eqHtml;
        
        if(shootDatePicker) shootDatePicker.destroy(); shootDatePicker = flatpickr("#sh-tarih", { dateFormat: "Y-m-d", locale: "tr", defaultDate: s.tarih, altInput: true, altFormat: "j F Y" }); document.getElementById('sh-saat').value = s.saat || ""; document.getElementById('shoot-extra-fields').style.display = 'block'; document.getElementById('shoot-buttons').innerHTML = `<button type="button" class="login-btn btn-orange" id="save-shoot-btn" style="flex: 1;" onclick="saveShoot()">Kaydet</button><button type="button" class="login-btn" style="flex: 1; background: var(--primary-red);" onclick="deleteShoot('${docId}')">Sil</button><button type="button" class="login-btn btn-gray" style="flex: 1;" onclick="closeModal('shoot-modal')">Kapat</button>`; openModal('shoot-modal'); 
    }
    
    async function saveShoot() { 
        const docId = document.getElementById('sh-doc-id').value; const btn = document.getElementById('save-shoot-btn'); btn.innerText = "Kaydediliyor..."; 
        try { 
            let selectedKisiler = []; document.querySelectorAll('.sh-kisi-cb:checked').forEach(cb => { selectedKisiler.push(cb.value); }); 
            let selectedEq = []; document.querySelectorAll('.sh-eq-cb:checked').forEach(cb => { selectedEq.push(cb.value); });
            let t_date = shootDatePicker.selectedDates.length > 0 ? formatDate(shootDatePicker.selectedDates[0]) : formatDate(new Date()); 
            const shootData = { holding: currentCompany, firma: document.getElementById('sh-firma').value || "", kisi: selectedKisiler, equipments: selectedEq, tarih: t_date, saat: document.getElementById('sh-saat').value, not: document.getElementById('sh-not').value, link: document.getElementById('sh-link').value, boyut: document.getElementById('sh-boyut').value, foto: parseInt(document.getElementById('sh-foto').value) || 0, video: parseInt(document.getElementById('sh-video').value) || 0, cekildi: document.getElementById('sh-cekildi').checked, teslim: document.getElementById('sh-teslim').checked, hdd: document.getElementById('sh-hdd').checked, drive: document.getElementById('sh-drive').checked }; 
            if(docId === "new") await db.collection('shoots').add(shootData); else await db.collection('shoots').doc(docId).update(shootData); closeModal('shoot-modal'); await fetchShootsFromFirebase(); loadPageView(activePage); 
        } catch (error) { console.error("Çekim Kayıt Hatası:", error); alert("Çekim kaydedilemedi."); btn.innerText = "Kaydet"; } 
    }
    
    async function deleteShoot(docId) { if(confirm("Çekimi silmek istediğinize emin misiniz?")) { await db.collection('shoots').doc(docId).delete(); closeModal('shoot-modal'); await fetchShootsFromFirebase(); loadPageView(activePage); } }
    function goToShootLink() { const link = document.getElementById('sh-link').value.trim(); if(link) window.open(link.startsWith('http') ? link : 'https://' + link, '_blank'); else alert('Lütfen geçerli bir link girin.'); }
    function loadProfileView() { document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active')); document.getElementById('main-content').innerHTML = `<div class="content-card" style="max-width: 600px;"><h2 class="content-title">Profil Bilgileri</h2><div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px;"><div class="input-group"><label>İSİM</label><input type="text" value="${currentUser.name || ""}" disabled></div><div class="input-group"><label>SOYİSİM</label><input type="text" value="${currentUser.surname || ""}" disabled></div></div><h3 style="font-size: 15px; margin-bottom: 15px; color: var(--bg-dark);">Şifre Değiştir</h3><div class="input-group"><label>YENİ ŞİFRE</label><input type="password" id="new-profile-pass" autocomplete="new-password"></div><button type="button" class="login-btn" onclick="updateOwnPassword()">Şifreyi Güncelle</button></div>`; }
    async function updateOwnPassword() { const newPass = document.getElementById('new-profile-pass').value; if(newPass) { currentUser.pass = newPass; await db.collection('users').doc(currentUser.docId).update({ pass: newPass }); await fetchUsersFromFirebase(); alert('Şifreniz güncellendi!'); } }

</script>
</body>
</html>
